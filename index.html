        const video = document.getElementById('main-player');
        const grid = document.getElementById('channel-grid');
        const status = document.getElementById('status');
        const searchInput = document.getElementById('search-input');
        
        let allChannels = [];
        let hlsPlayer = null;

        const FALLBACK_LOGO = 'https://via.placeholder.com/100/1e293b/38bdf8?text=DONKU+TV';

        function playStream(url) {
            if (window.location.protocol === 'https:' && url.startsWith('http://')) {
                url = url.replace('http://', 'https://');
            }

            if (hlsPlayer) {
                hlsPlayer.destroy();
                hlsPlayer = null;
            }

            if (Hls.isSupported()) {
                hlsPlayer = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90,
                    maxBufferLength: 30,
                    maxMaxBufferLength: 600
                });

                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);

                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play().catch(e => {
                        console.warn("Autoplay with audio blocked. Retrying muted...", e);
                        video.muted = true;
                        video.play();
                    });
                });

                hlsPlayer.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.error("Fatal network error encountered, trying to recover...");
                                hlsPlayer.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.error("Fatal media error encountered, trying to recover...");
                                hlsPlayer.recoverMediaError();
                                break;
                            default:
                                console.error("Unrecoverable error encountered, destroying player...");
                                hlsPlayer.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function () {
                    video.play();
                });
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            const channels = [];
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    const logo = logoMatch ? logoMatch[1] : FALLBACK_LOGO;
                    
                    const nameSplit = line.split(',');
                    const name = nameSplit.length > 1 ? nameSplit[nameSplit.length - 1].trim() : 'Live Channel';

                    currentChannel = { name, logo };
                } else if (line.startsWith('http://') || line.startsWith('https://')) {
                    currentChannel.url = line;
                    if (!currentChannel.name) {
                        currentChannel.name = 'Live Channel';
                        currentChannel.logo = FALLBACK_LOGO;
                    }
                    channels.push(currentChannel);
                    currentChannel = {};
                }
            }
            return channels;
        }

        function renderChannels(channels) {
            grid.innerHTML = '';
            if (channels.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#94a3b8;">No channels found.</p>';
                return;
            }

            channels.forEach((ch) => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `
                    <img src="${ch.logo}" onerror="this.onerror=null; this.src='${FALLBACK_LOGO}'" alt="${ch.name}">
                    <p>${ch.name}</p>
                `;
                card.onclick = () => {
                    video.muted = false;
                    playStream(ch.url);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                grid.appendChild(card);
            });
        }

        function initChannels() {
            allChannels = parseM3U(M3U_RAW_DATA);
            status.innerText = `Total ${allChannels.length} Channels Available`;
            renderChannels(allChannels);

            if (allChannels.length > 0) {
                playStream(allChannels[0].url);
            }
        }

        initChannels();

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(query));
            renderChannels(filtered);
        });
    </script>
