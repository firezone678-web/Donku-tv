<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DONKU TV - Live Streaming</title>
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; }
        header h1 { font-size: 20px; color: #38bdf8; letter-spacing: 1px; }
        header span { font-size: 13px; color: #94a3b8; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 200px; background: #0f172a; padding: 15px; border-right: 1px solid #1e293b; display: flex; flex-direction: column; gap: 8px; }
        .sidebar button { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 10px 12px; text-align: left; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .sidebar button:hover, .sidebar button.active { background: #0284c7; color: #fff; font-weight: bold; border-color: #38bdf8; }
        .content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        #player-wrapper { width: 100%; max-width: 850px; height: 480px; margin: 0 auto; background: #000; border-radius: 10px; overflow: hidden; border: 2px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
        .card { background: #1e293b; border: 2px solid #334155; border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
        .card:hover { border-color: #38bdf8; transform: translateY(-3px); box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2); }
        .card img { width: 100%; height: 65px; object-fit: contain; border-radius: 6px; background: #0f172a; padding: 4px; }
        .card p { font-size: 12px; color: #f8fafc; font-weight: 600; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge { position: absolute; top: 5px; right: 5px; background: #ef4444; color: white; font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .loading { text-align: center; color: #38bdf8; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>DONKU TV</h1>
        <span>Live Stream Portal</span>
    </header>
    <div class="main-container">
        <div class="sidebar">
            <button class="active" onclick="filterCategory('all', this)">All Channels</button>
        </div>
        <div class="content">
            <div id="player-wrapper"></div>
            <div class="grid" id="channel-grid">
                <div class="loading">চ্যানেল লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</div>
            </div>
        </div>
    </div>
    <script>
        const m3uUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('http://tahmidx.tech/m3u/live-tv.m3u');
        let channels = [];
        let player = null;

        function initPlayer(streamUrl) {
            if (player) player.destroy();
            player = new Clappr.Player({
                source: streamUrl,
                parentId: "#player-wrapper",
                width: "100%",
                height: "100%",
                autoPlay: true
            });
        }

        async function fetchM3U() {
            try {
                const response = await fetch(m3uUrl);
                const text = await response.text();
                const lines = text.split('\n');
                let currentChannel = {};

                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        const nameMatch = line.match(/,(.+)$/);
                        const name = nameMatch ? nameMatch[1].trim() : "Unknown Channel";
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        const logo = logoMatch ? logoMatch[1] : "";
                        const groupMatch = line.match(/group-title="([^"]+)"/);
                        const cat = groupMatch ? groupMatch[1] : "General";
                        currentChannel = { name, logo, cat };
                    } else if (line && !line.startsWith('#')) {
                        currentChannel.stream = line;
                        channels.push(currentChannel);
                        currentChannel = {};
                    }
                });

                if (channels.length > 0) {
                    initPlayer(channels[0].stream);
                    renderGrid();
                } else {
                    document.getElementById('channel-grid').innerHTML = '<div class="loading">কোনো চ্যানেল পাওয়া যায়নি।</div>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('channel-grid').innerHTML = '<div class="loading">M3U ফাইল লোড করতে সমস্যা হয়েছে।</div>';
            }
        }

        function renderGrid() {
            const grid = document.getElementById('channel-grid');
            grid.innerHTML = '';
            channels.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => initPlayer(ch.stream);
                const logoSrc = ch.logo ? ch.logo : 'https://via.placeholder.com/100x60?text=TV';
                card.innerHTML = `
                    <span class="badge">LIVE</span>
                    <img src="${logoSrc}" alt="${ch.name}" onerror="this.src='https://via.placeholder.com/100x60?text=TV'">
                    <p>${ch.name}</p>
                `;
                grid.appendChild(card);
            });
        }

        fetchM3U();
    </script>
</body>
</html>
